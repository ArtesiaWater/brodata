name: brodata

on:
  # Trigger the workflow on push or pull request on main,
  # and only on pull-requests on dev branch
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ci]

      - name: Run tests
        run: |
          pytest ./tests --cov=brodata --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Generate coverage badge
        run: |
          import xml.etree.ElementTree as ET
          
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          coverage = float(root.get('line-rate', 0)) * 100
          coverage_pct = int(coverage)
          
          # Determine color based on coverage percentage
          if coverage_pct >= 80:
              color = '44cc11'  # green
          elif coverage_pct >= 60:
              color = 'dfb317'  # yellow
          else:
              color = 'e05d44'  # red

          left_label = 'coverage (main)'
          badge_width = 170
          left_width = 132
          right_width = badge_width - left_width
          left_center = left_width / 2
          right_center = left_width + right_width / 2
          
          # Generate a flat SVG badge without an opaque overlay.
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{badge_width}" height="20" role="img" aria-label="coverage (main): {coverage_pct}%"><title>coverage (main): {coverage_pct}%</title><rect rx="3" width="{badge_width}" height="20" fill="#555"/><rect rx="3" x="{left_width}" width="{right_width}" height="20" fill="#{color}"/><path fill="#{color}" d="M{left_width} 0h4v20h-4z"/><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11"><text x="{left_center}" y="15">{left_label}</text><text x="{right_center}" y="15">{coverage_pct}%</text></g></svg>'''
          
          with open('htmlcov/coverage-badge-main.svg', 'w') as f:
              f.write(svg)
          print(f'Coverage badge generated: htmlcov/coverage-badge-main.svg ({coverage_pct}%)')
        shell: python

      - name: Upload coverage artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: htmlcov

  deploy-coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy coverage report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
