name: brodata

on:
  # Trigger the workflow on push or pull request on main,
  # and only on pull-requests on dev branch
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ci]

      - name: Run tests
        run: |
          pytest ./tests --cov=brodata --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Generate coverage badge
        run: |
          import xml.etree.ElementTree as ET
          import math
          import os
          
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          coverage = float(root.get('line-rate', 0)) * 100
          coverage_pct = math.ceil(coverage)
          
          # Determine color based on coverage percentage
          if coverage_pct >= 80:
              color = '44cc11'  # green
          elif coverage_pct >= 60:
              color = 'dfb317'  # yellow
          else:
              color = 'e05d44'  # red
          
          # Generate SVG badge
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="124" height="20" role="img" aria-label="coverage: {coverage_pct}%"><title>coverage: {coverage_pct}%</title><linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb"/><stop offset="1" stop-color="#999"/></linearGradient><clipPath id="r"><rect width="124" height="20" rx="3" fill="#fff"/></clipPath><g clip-path="url(#r)"><rect width="93" height="20" fill="#555"/><rect x="93" width="31" height="20" fill="#{color}"/><rect width="124" height="20" fill="url(#s)"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110"><text aria-hidden="true" x="475" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="830">coverage</text><text x="475" y="140" transform="scale(.1)" fill="#fff" textLength="830">coverage</text><text aria-hidden="true" x="1075" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="210">{coverage_pct}%</text><text x="1075" y="140" transform="scale(.1)" fill="#fff" textLength="210">{coverage_pct}%</text></g></svg>'''
          
          # Generate branch-specific badge file
          branch = os.environ.get('GITHUB_REF', '').split('/')[-1]
          badge_filename = f'coverage-badge-{branch}.svg'
          with open(f'htmlcov/{badge_filename}', 'w') as f:
              f.write(svg)
          print(f'Coverage badge generated: htmlcov/{badge_filename} ({coverage_pct}%)')
        shell: python

      - name: Upload coverage preview artifact (dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-dev
          path: htmlcov
          retention-days: 7

      - name: Prepare dev coverage for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          mkdir -p pages-deploy/dev
          cp -r htmlcov/* pages-deploy/dev/

      - name: Prepare main coverage for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p pages-deploy
          cp -r htmlcov/* pages-deploy/

      - name: Upload coverage artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-deploy

  deploy-coverage:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy coverage report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
